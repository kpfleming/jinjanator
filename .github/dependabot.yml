version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github/codeql-action:
        patterns:
          - github/codeql-action/analyze
          - github/codeql-action/init
          - github/codeql-action/upload-sarif
